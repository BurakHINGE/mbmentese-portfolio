<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <title>Mehmet Burak Menteşe</title>

    <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header-Navbar -->
    <header>
        <a href="index.html" class="nav-logo-container">
            <img src="./Assets/favicon.png" alt="Website Logo" class="nav-logo">
            <span class="nav-brand">Mehmet Burak Menteşe</span>
        </a>
        <nav>
            <!-- Ana sayfa linki hero.html yerine index.html olarak güncellendi -->
            <a href="index.html" class="nav-link" data-translate="home">Ana Sayfa</a>
            <a href="hakkimda.html" class="nav-link" data-translate="about">Hakkımda</a>
            <a href="projeler.html" class="nav-link" data-translate="projects">Projeler</a>
            <a href="blog.html" class="nav-link" data-translate="blog">Blog</a>
            <a href="iletisim.html" class="nav-link" data-translate="contact me">İletişim</a>
            <span id="lang-tr" class="lang-active">TR</span><span class="lang-separator">/</span><span id="lang-en">EN</span>
        </nav>
    </header>

    <!-- ANA SAYFA BÖLÜMÜ -->
    <section id="hero">
        <main id="landing-card">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <!-- Terminal Status Bar -->
            <div class="terminal-status-bar">
                <div class="terminal-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
            </div>

            <p class="subtitle" id="site-subtitle">
                <span data-translate="subtitle">Kişisel Portfolyo ve Blog</span><span class="domain-highlight" id="typewriter-target"></span><span class="cursor"></span>
            </p>
            <h1 id="club-title" data-translate="title">Merhaba, ben Mehmet Burak Menteşe</h1>

            <div class="social-links">
                <a href="https://github.com/BurakHINGE" target="_blank" rel="noopener noreferrer" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://www.linkedin.com/in/mehmetburakmentese/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>
                <a href="https://medium.com/@burakmentese16" target="_blank" rel="noopener noreferrer" title="Medium">
                    <span class="classic-medium">M</span>
                </a>
            </div>

        </main>
        <div class="github-card">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <h3 class="graph-title" data-translate="githubGraph">GitHub Aktiviteleri</h3>
            <img src="https://ghchart.rshah.org/BurakHINGE" alt="Mehmet Burak Menteşe GitHub Contributions" class="github-chart">
        </div>
    </section>

    <script src="script.js"></script>

</html>
